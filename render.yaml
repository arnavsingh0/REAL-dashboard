 services:
  # ── Backend API ──────────────────────────────────────
  - type: web
    name: real-cubesat-api
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: free
    envVars:
      - key: SATNOGS_TOKEN
        sync: false
      - key: JHUAPL_USER
        sync: false
      - key: JHUAPL_PASS
        sync: false
      - key: CACHE_TTL_SEC
        value: "1800"
      - key: NORAD_ID
        value: "64875"
      # CORS is now allow_origins=["*"] in main.py (no credentials needed)
    healthCheckPath: /health

  # ── Frontend (static React build) ────────────────────
  - type: web
    name: real-cubesat-dashboard
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_URL
        value: "https://real-cubesat-api.onrender.com"
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=0, must-revalidate
    routes:
      - type: rewrite
        source: /*
        destination: /index.html